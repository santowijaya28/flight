openapi: 3.0.3
info:
  title: Flight Search API
  version: 1.0.0
  description: |
    Aggregated flight search API for AirAsia, Batik Air, Garuda Indonesia,
    and Lion Air mock providers.

    The API normalizes provider responses into a common flight format, applies
    search filters, sorts the combined result set, and returns the result.
servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Health
  - name: Search

paths:
  /ping:
    get:
      tags:
        - Health
      summary: Health check
      operationId: ping
      responses:
        '200':
          description: Service is alive
          content:
            text/plain:
              schema:
                type: string
                example: pong

  /search:
    get:
      tags:
        - Search
      summary: Search and aggregate flights
      operationId: searchFlights
      parameters:
        - name: origin
          in: query
          required: true
          description: Origin airport IATA code.
          schema:
            type: string
            example: CGK
        - name: destination
          in: query
          required: true
          description: Destination airport IATA code.
          schema:
            type: string
            example: DPS
        - name: departure_date
          in: query
          required: true
          description: Departure date.
          schema:
            type: string
            format: date
            example: '2025-12-15'
        - name: passengers
          in: query
          required: true
          description: Number of passengers.
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: cabin_class
          in: query
          required: false
          description: Cabin class filter. Empty means all cabin classes.
          schema:
            type: string
            example: economy
        - name: sort
          in: query
          required: false
          description: |
            Comma-separated sort keys. The first key is the primary sort,
            subsequent keys are tie-breakers. Flight ID is the final
            deterministic tie-breaker. Defaults to `price_asc`.
          schema:
            type: string
            default: price_asc
            pattern: '^((price|duration|departure|arrival)_(asc|desc))(,((price|duration|departure|arrival)_(asc|desc)))*$'
            example: price_asc,duration_asc
        - name: min_price
          in: query
          required: false
          description: Minimum total price.
          schema:
            type: number
            format: double
            minimum: 0
            example: 500000
        - name: max_price
          in: query
          required: false
          description: Maximum total price.
          schema:
            type: number
            format: double
            minimum: 0
            example: 1500000
        - name: max_stops
          in: query
          required: false
          description: Maximum number of stops. Use `0` for direct flights only.
          schema:
            type: integer
            minimum: 0
            example: 1
        - name: airlines
          in: query
          required: false
          description: Comma-separated airline IATA codes or airline names.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
            example: [QZ, JT]
        - name: min_duration
          in: query
          required: false
          description: Minimum total duration in minutes.
          schema:
            type: integer
            format: int64
            minimum: 0
            example: 90
        - name: max_duration
          in: query
          required: false
          description: Maximum total duration in minutes.
          schema:
            type: integer
            format: int64
            minimum: 0
            example: 240
        - name: departure_from
          in: query
          required: false
          description: Earliest departure local time in HH:MM format.
          schema:
            type: string
            pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
            example: '06:00'
        - name: departure_to
          in: query
          required: false
          description: Latest departure local time in HH:MM format.
          schema:
            type: string
            pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
            example: '18:00'
        - name: arrival_from
          in: query
          required: false
          description: Earliest arrival local time in HH:MM format.
          schema:
            type: string
            pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
            example: '08:00'
        - name: arrival_to
          in: query
          required: false
          description: Latest arrival local time in HH:MM format.
          schema:
            type: string
            pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
            example: '23:00'
      responses:
        '200':
          description: Search completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Search failed because providers were unavailable or an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    SearchResponse:
      type: object
      required:
        - search_criteria
        - metadata
        - flights
      properties:
        search_criteria:
          $ref: '#/components/schemas/SearchCriteria'
        metadata:
          $ref: '#/components/schemas/SearchMetadata'
        flights:
          type: array
          items:
            $ref: '#/components/schemas/Flight'

    SearchCriteria:
      type: object
      required:
        - origin
        - destination
        - departure_date
        - passengers
        - cabin_class
      properties:
        origin:
          type: string
          example: CGK
        destination:
          type: string
          example: DPS
        departure_date:
          type: string
          format: date
          example: '2025-12-15'
        return_date:
          type: string
          format: date
          nullable: true
          example: null
        passengers:
          type: integer
          minimum: 1
          example: 1
        cabin_class:
          type: string
          example: economy

    SearchMetadata:
      type: object
      required:
        - total_results
        - providers_queried
        - providers_succeeded
        - providers_failed
        - search_time_ms
      properties:
        total_results:
          type: integer
          example: 13
        providers_queried:
          type: integer
          example: 4
        providers_succeeded:
          type: integer
          example: 4
        providers_failed:
          type: integer
          example: 0
        search_time_ms:
          type: integer
          format: int64
          example: 1

    Flight:
      type: object
      required:
        - id
        - provider
        - airline
        - flight_number
        - departure
        - arrival
        - duration
        - stops
        - price
        - available_seats
        - cabin_class
        - aircraft
        - amenities
        - baggage
      properties:
        id:
          type: string
          example: QZ7250_AirAsia
        provider:
          type: string
          example: AirAsia
        airline:
          $ref: '#/components/schemas/Airline'
        flight_number:
          type: string
          example: QZ7250
        departure:
          $ref: '#/components/schemas/FlightEndpoint'
        arrival:
          $ref: '#/components/schemas/FlightEndpoint'
        duration:
          $ref: '#/components/schemas/Duration'
        stops:
          type: integer
          minimum: 0
          example: 1
        price:
          $ref: '#/components/schemas/Price'
        available_seats:
          type: integer
          format: int64
          minimum: 0
          example: 88
        cabin_class:
          type: string
          example: economy
        aircraft:
          type: object
          nullable: true
          properties:
            model:
              type: string
              example: Boeing 737-800
        amenities:
          type: array
          items:
            type: string
          example: [beverage, snack]
        baggage:
          $ref: '#/components/schemas/Baggage'

    Airline:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          example: AirAsia
        code:
          type: string
          example: QZ

    FlightEndpoint:
      type: object
      required:
        - airport
        - city
        - datetime
        - timestamp
      properties:
        airport:
          type: string
          example: CGK
        city:
          type: string
          example: Jakarta
        timezone:
          type: string
          description: Indonesian timezone label when the airport is known.
          example: WIB
        datetime:
          type: string
          format: date-time
          example: '2025-12-15T15:15:00+07:00'
        timestamp:
          type: integer
          format: int64
          example: 1765786500

    Duration:
      type: object
      required:
        - total_minutes
        - formatted
      properties:
        total_minutes:
          type: integer
          format: int64
          minimum: 0
          example: 260
        formatted:
          type: string
          example: 4h 20m

    Price:
      type: object
      required:
        - amount
        - currency
        - formatted
      properties:
        amount:
          type: number
          format: double
          minimum: 0
          example: 485000
        currency:
          type: string
          example: IDR
        formatted:
          type: string
          example: Rp 485.000

    Baggage:
      type: object
      properties:
        carry_on:
          type: string
          example: Cabin baggage only
        checked:
          type: string
          example: Additional fee

    ErrorResponse:
      type: object
      required:
        - header
      properties:
        header:
          type: object
          required:
            - error
          properties:
            error:
              type: string
              example: 'invalid input: empty origin'
